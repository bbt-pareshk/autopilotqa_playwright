name: Playwright CI – Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - live

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Resolve Environment
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          fi

      - name: Run Smoke Tests
        env:
          CI: true
        run: |
          echo "Running Smoke Tests on $ENVIRONMENT"
          npx playwright test --grep @smoke || true

      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline
          allure generate --clean -o allure-report ./allure-results || true

      - name: Upload Allure Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy Allure to PUBLIC GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: bbt-pareshk/autopilotqa-allure-report
          publish_branch: gh-pages
          publish_dir: ./allure-report
          user_name: github-actions
          user_email: github-actions@github.com

      - name: Add CI Summary
        run: |
          echo "## 📊 Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔵 Allure Report:" >> $GITHUB_STEP_SUMMARY
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/autopilotqa-allure-report/" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          ALLURE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/autopilotqa-allure-report/"
          CI_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Properly aligned HEREDOC
          cat > payload.json <<EOF
{
  "text": "*Playwright Smoke Tests*\n• Status: *$STATUS*\n• Environment: *$ENVIRONMENT*\n\n🔒 CI Run: $CI_URL\n🌍 Allure Report: $ALLURE_URL"
}
EOF

          curl -X POST -H "Content-type: application/json" \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"
