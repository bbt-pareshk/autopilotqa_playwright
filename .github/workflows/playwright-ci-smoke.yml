name: Playwright CI – Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - live

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLURE_PAGES_REPO: autopilotqa-allure-report

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5️⃣ Install Linux system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libpangocairo-1.0-0 libgtk-3-0 \
            libxshmfence1 libx11-xcb1 libxcb-dri3-0 libxfixes3 \
            libxrender1 libxcb1 libxext6 fonts-liberation libwoff1 \
            wget || echo "Some packages failed, continuing..."

      # 🌍 Resolve environment name
      - name: Resolve Environment
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          fi

      # 🔗 Set Base URL dynamically
- name: Set Base URL
  run: |
    if [ "$ENVIRONMENT" = "staging" ]; then
      echo "BASE_URL=${{ secrets.STAGING_BASE_URL }}" >> $GITHUB_ENV
    else
      echo "BASE_URL=${{ secrets.LIVE_BASE_URL }}" >> $GITHUB_ENV
    fi
    
      # 6️⃣ Run Smoke Tests (SAFE)
      - name: Run Smoke Tests
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CI: true
        run: |
          echo "Running Smoke Tests on ${{ inputs.environment }}"
          npx playwright test --grep @smoke || true

      # 7️⃣ Optional severity gate
      - name: Fail build on critical failures
        run: |
          if [ -f scripts/check-critical.js ]; then
            node scripts/check-critical.js || true
          else
            echo "No critical check script found"
          fi

      # 8️⃣ Generate Allure
      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline
          mkdir -p allure-report
          allure generate --clean -o allure-report ./allure-results || true

      # 9️⃣ Upload Allure artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # 🔟 Upload Playwright HTML report
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report

      # 1️⃣1️⃣ Deploy Allure to PUBLIC GitHub Pages repo
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: bbt-pareshk/autopilotqa-allure-report
          publish_branch: gh-pages
          publish_dir: ./allure-report
          user_name: github-actions
          user_email: github-actions@github.com

      # 1️⃣2️⃣ CI Summary links
      - name: Add CI Summary Links
        run: |
          ALLURE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${ALLURE_PAGES_REPO}/"
          echo "## 📊 Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔵 Allure Report (Online)" >> $GITHUB_STEP_SUMMARY
          echo "👉 $ALLURE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🟢 Playwright HTML Report" >> $GITHUB_STEP_SUMMARY
          echo "👉 Download from **Artifacts → playwright-html-report**" >> $GITHUB_STEP_SUMMARY

      # 📊 Collect Playwright test statistics + failed test names
      - name: Collect Test Stats
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('fs');

          const file = 'results/results.json';
          if (!fs.existsSync(file)) {
            fs.appendFileSync(process.env.GITHUB_ENV,
              'TOTAL=0\nPASSED=0\nFAILED=0\nSKIPPED=0\nFLAKY=0\nFAILED_TESTS=None\n'
            );
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const stats = data.stats || {};

          const passed = stats.expected || 0;
          const failed = stats.unexpected || 0;
          const skipped = stats.skipped || 0;
          const flaky = stats.flaky || 0;
          const total = passed + failed + skipped + flaky;

          const failedTests = new Set();

          function walkSuites(suites = []) {
            for (const suite of suites) {
              if (suite.suites) walkSuites(suite.suites);
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  if ((test.results || []).some(r => r.status === 'failed')) {
                    failedTests.add(spec.title);
                  }
                }
              }
            }
          }

          walkSuites(data.suites || []);

          const failedList =
            failedTests.size === 0
              ? 'None'
              : Array.from(failedTests).slice(0, 5).join('\\n• ');

          fs.appendFileSync(process.env.GITHUB_ENV, `TOTAL=${total}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PASSED=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FAILED=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `SKIPPED=${skipped}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FLAKY=${flaky}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FAILED_TESTS=${failedList}\n`);
          EOF

      # 🔔 Slack Notification
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          COLOR="#36a64f"
          ALLURE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${ALLURE_PAGES_REPO}/"

          if [ "$STATUS" != "success" ]; then
            COLOR="#ff0000"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"$COLOR\",
              \"title\": \"Playwright Test Results\",
              \"text\": \"*Workflow:* ${{ github.workflow }}\n*Status:* $STATUS\n*Environment:* $ENVIRONMENT\n\n*Test Summary*\n• Total: *$TOTAL*\n• Passed: *$PASSED*\n• Failed: *$FAILED*\n• Skipped: *$SKIPPED*\n• Flaky: *$FLAKY*\n\n*Failed Tests (Top 5)*\n• $FAILED_TESTS\n\n🌍 Allure Report: $ALLURE_URL\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View CI Run>\"
            }]
          }" $SLACK_WEBHOOK_URL
